name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "stable_master"
      - "dev"
      - "zorono/vcpkg"
      - "main"
    paths:
      - "**.hpp"
      - "**.cpp"
      - "**.h"
      - "**.c"
      - "**.cc"
      - "**CMakeLists.txt"
      - "**.cmake"
      - ".github/workflows/build.yml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
  pull_request:
    branches:
      - "master"
      - "stable_master"
      - "main"
      - "zorono/vcpkg"
    paths:
      - "**.hpp"
      - "**.cpp"
      - "**.h"
      - "**.c"
      - "**.cc"
      - "**CMakeLists.txt"
      - "**.cmake"
      - ".github/workflows/build.yml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"

jobs:
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-2022
    continue-on-error: false

    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
        include:
          - arch: Win32
            triplet: x86-windows
          - arch: x64
            triplet: x64-windows

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Declare build output variables
        id: vars
        shell: bash
        run: |
          echo "build_version=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_config=RelWithDebInfo" >> $GITHUB_OUTPUT

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-windows-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-windows-${{ matrix.triplet }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_cache" | Out-Null
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:OMP_BUILD_VERSION = (git rev-list $(git rev-list --max-parents=0 HEAD) HEAD | Measure-Object -Line).Lines
          $env:OMP_BUILD_COMMIT = (git rev-parse HEAD)
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -T "ClangCL" `
            -DCMAKE_BUILD_TYPE=${{ steps.vars.outputs.build_config }} `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}"

      - name: Build
        run: cmake --build build --config ${{ steps.vars.outputs.build_config }} --parallel

      - name: Create build archive
        id: build
        shell: pwsh
        run: |
          $version = "${{ steps.vars.outputs.build_version }}"
          $artifactName = "open.mp-win-${{ matrix.arch }}-${version}"
          echo "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          $serverDir = "build/Output/${{ steps.vars.outputs.build_config }}/Server"
          $zipPath = "build/Output/${{ steps.vars.outputs.build_config }}/${artifactName}.zip"
          Compress-Archive -Path $serverDir -DestinationPath $zipPath -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: build/Output/${{ steps.vars.outputs.build_config }}/${{ steps.build.outputs.artifact_name }}.zip
          if-no-files-found: error

  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    continue-on-error: false

    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]
        include:
          - arch: x86
            triplet: x86-linux
            flags: '-DCMAKE_SYSTEM_PROCESSOR=i686 -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_EXE_LINKER_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"'
          - arch: x86_64
            triplet: x64-linux
            flags: ''

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Declare build output variables
        id: vars
        shell: bash
        run: |
          echo "build_version=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_config=RelWithDebInfo" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            tar wget binutils cmake make ninja-build \
            gcc g++ libc6-dev-i386 libc6-dev gcc-multilib g++-multilib build-essential \
            clang llvm pkg-config autoconf automake libtool zip unzip

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-linux-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-linux-${{ matrix.triplet }}-

      - name: Setup vcpkg
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg_cache"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure CMake
        env:
          CC: clang
          CXX: clang++
        run: |
          export OMP_BUILD_VERSION=$(git rev-list $(git rev-list --max-parents=0 HEAD) HEAD | wc -l)
          export OMP_BUILD_COMMIT=$(git rev-parse HEAD)
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=${{ steps.vars.outputs.build_config }} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DTARGET_BUILD_ARCH=${{ matrix.arch }} \
            ${{ matrix.flags }} \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}"

      - name: Build
        run: cmake --build build --config ${{ steps.vars.outputs.build_config }} --parallel $(nproc)

      - name: Create build archive
        id: build
        run: |
          version="${{ steps.vars.outputs.build_version }}"
          artifact_name="open.mp-linux-${{ matrix.arch }}-${version}"
          echo "artifact_name=${artifact_name}" >> $GITHUB_OUTPUT
          cd "build/Output/${{ steps.vars.outputs.build_config }}"
          tar -cJvf "${artifact_name}.tar.xz" "Server"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: build/Output/${{ steps.vars.outputs.build_config }}/${{ steps.build.outputs.artifact_name }}.tar.xz
          if-no-files-found: error

  build-macos-arm:
    name: macOS ARM (arm64)
    runs-on: macos-latest
    continue-on-error: false

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Declare build output variables
        id: vars
        shell: bash
        run: |
          echo "build_version=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_config=RelWithDebInfo" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: brew install ninja

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-macos-arm64-

      - name: Setup vcpkg
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg_cache"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure CMake
        run: |
          export OMP_BUILD_VERSION=$(git rev-list $(git rev-list --max-parents=0 HEAD) HEAD | wc -l)
          export OMP_BUILD_COMMIT=$(git rev-parse HEAD)
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=${{ steps.vars.outputs.build_config }} \
            -DTARGET_BUILD_ARCH=armv8 \
            -DBUILD_SERVER=1 \
            -DBUILD_ABI_CHECK_TOOL=0 \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="arm64-osx"

      - name: Build
        run: cmake --build build --config ${{ steps.vars.outputs.build_config }} --parallel $(sysctl -n hw.logicalcpu)

      - name: Create build archive
        id: build
        shell: bash
        run: |
          version="${{ steps.vars.outputs.build_version }}"
          artifact_name="open.mp-macos-arm64-${version}"
          echo "artifact_name=${artifact_name}" >> $GITHUB_OUTPUT
          cd "build/Output/${{ steps.vars.outputs.build_config }}"
          tar -cJvf "${artifact_name}.tar.xz" "Server"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: build/Output/${{ steps.vars.outputs.build_config }}/${{ steps.build.outputs.artifact_name }}.tar.xz
          if-no-files-found: error
